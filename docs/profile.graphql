query GetProfile {
  profile {
    name
    description
    location
    links {
      email
      telegram
      git
      hh
    }
    skills {
      name
      level
    }
    experience {
      id
      startDate
      endDate
      employment {
        company
        position
      }
      project {
        name
        url
      }
      skills {
        name
        level
      }
    }
    hobbies {
      id
      name
    }
  }
}
