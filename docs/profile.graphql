query GetProfile {
  profile {
    name
    description
    location
    links {
      email
      telegram
      git
      hh
    }
    experience {
      id
      startDate
      endDate
      employment { company position }
      project { name url }
      skills { name level }
    }
    skills {
      name
      level
    }
    hobbies {
      name
    }
  }
}